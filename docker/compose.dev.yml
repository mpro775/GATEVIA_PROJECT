services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gatevia
      POSTGRES_PASSWORD: gatevia
      POSTGRES_DB: gatevia
    ports: ["5432:5432"]
    volumes: ["gatevia_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatevia"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["gatevia_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: gatevia
      MINIO_ROOT_PASSWORD: local-development-only
    ports: ["9000:9000", "9001:9001"]
    volumes: ["gatevia_minio:/data"]
volumes:
  gatevia_pg:
  gatevia_redis:
  gatevia_minio:
